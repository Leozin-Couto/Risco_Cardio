<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="static/sytles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risco Cardio</title>
</head>
<body>
    <h1>Site de Teste Cardiaco</h1>
    <div class="formulario" id="formulario_idade">
        <p>Insira as informações</p>
        idade: <input type="number" min="0" placeholder="Digite a idade"><br>
        Pressão sistólica: <input type="number" min="0" placeholder="Digite a Pressão sistólica (ex: 120)"><br>
        Colesterol total: <input type="number" min="0" placeholder="Digite a Colesterol total (ex: 200)"><br>
        Fumante (1 = Sim / 0 = Não): <input type="number" min="0" max="1" placeholder="Digite a Fumante? (1 = Sim / 0 = Não)"><br>
        IMC: <input type="number" min="10.1" placeholder="Digite o IMC"><br>
    </div>
    <div class="resultado">
        <h1>resultado</h1>
    </div>
</body>
</html>
